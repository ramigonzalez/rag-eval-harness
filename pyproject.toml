[project]
name = "rag-eval-harness"
version = "0.1.0"
description = "Measured comparison of RAG chunking and retrieval strategies."
readme = "README.md"
requires-python = ">=3.10"
authors = [{ name = "Ramiro Gonzalez" }]
license = "MIT"
license-files = ["LICENSE"]
dependencies = [
    "numpy>=1.26",
    "fastembed>=0.6.0",
    "matplotlib>=3.8",
    "pyyaml>=6",
]

[project.optional-dependencies]
dev = ["pytest>=8", "ruff>=0.6"]

[project.scripts]
raglab = "raglab.cli:main"

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
addopts = "-q"

[tool.ruff]
line-length = 100
target-version = "py311"
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP"]
