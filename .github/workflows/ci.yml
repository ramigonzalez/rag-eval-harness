name: ci

on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install
        run: |
          sudo apt-get update
          sudo apt-get install -y python3-dev build-essential
          # pytrec_eval 0.5 is K&R C. GCC 15 defaults to C23, where an empty
          # parameter list means (void) and the build fails. gnu17 restores it.
          CFLAGS="-std=gnu17" python -m pip install -e ".[dev]"
      - name: Lint
        run: ruff check src tests scripts && ruff format --check src tests scripts
      - name: Unit tests
        run: pytest
      - name: Smoke eval
        run: raglab run --config configs/smoke.yaml --check configs/smoke_thresholds.json
      - name: Search dry-run
        run: raglab search --config examples/baby-food-rag.yaml --dry-run
